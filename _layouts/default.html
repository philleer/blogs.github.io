<!DOCTYPE html>
<html lang="zh-CN">
  {%- include head.html -%}
  <body class="shell">
    {%- include header.html -%}
    <div class="stage">
      <main class="sheet">
        {{ content }}
      </main>
    </div>
    <footer class="bottombar">© All Rights Reserved 2026</footer>
    <script>
      (function () {
        var key = "phillee-lang";
        var lang = "zh";
        try { lang = localStorage.getItem(key) || "zh"; } catch (e) {}
        if (lang !== "en") lang = "zh";

        function apply(next) {
          lang = next;
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
          var nodes = document.querySelectorAll("[data-zh]");
          for (var i = 0; i < nodes.length; i++) {
            nodes[i].textContent = nodes[i].getAttribute(lang === "zh" ? "data-zh" : "data-en");
          }
          var button = document.querySelector(".lang-switch");
          if (button) {
            button.textContent = lang === "zh" ? "EN" : "中";
          }
          try { localStorage.setItem(key, lang); } catch (e) {}
        }

        var button = document.querySelector(".lang-switch");
        if (button) {
          button.addEventListener("click", function () {
            apply(lang === "zh" ? "en" : "zh");
          });
        }
        apply(lang);
      })();
      (function () {
        function markExternal(root) {
          var links = root.querySelectorAll("a[href]");
          for (var i = 0; i < links.length; i++) {
            var link = links[i];
            var href = link.getAttribute("href");
            if (!href || href.charAt(0) === "#" || href.indexOf("javascript:") === 0) continue;
            var leave = href.indexOf("mailto:") === 0 || href.indexOf("tel:") === 0;
            if (!leave) {
              try {
                var url = new URL(link.href, window.location.href);
                leave = (url.protocol === "http:" || url.protocol === "https:") && url.origin !== window.location.origin;
              } catch (e) {
                leave = false;
              }
            }
            if (!leave) continue;
            link.target = "_blank";
            var rel = link.getAttribute("rel") || "";
            if (rel.indexOf("noopener") === -1) rel = (rel + " noopener").replace(/^\s+/, "");
            if (rel.indexOf("noreferrer") === -1) rel = (rel + " noreferrer").replace(/^\s+/, "");
            link.setAttribute("rel", rel);
          }
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function () { markExternal(document); });
        } else {
          markExternal(document);
        }
      })();
    </script>
  </body>
</html>
